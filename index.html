<style>
/* layout: phone-first column — honeycomb hero, two place-value panels with live counters, caption and rail below */
:root{
  --bg:#fbf5e6; --glow:#fff7e2; --surface:#fffdf7; --raise:#f5edd8;
  --ink:#1f1b12; --muted:#897f66; --line:#e7dcbf;
  --gold:#b07d13; --amber:#f6c22a; --deep:#8a6209;
  --tens:#dfeaf7; --tensline:#9dbcdc; --tensink:#2a5b8e; --bandt:#5e8cbd;
  --ones:#fbe6ee; --onesline:#e3a8c2; --onesink:#a63f6c; --bando:#cf7aa0;
  --good:#1f7d5c;
  --wing:#e4f0fa; --wingline:#9db8cc; --combline:#8a6a1c;
  --disp:"Baloo Bhaijaan 2","Baloo","Trebuchet MS",sans-serif;
  --body:"Cairo","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14110b; --glow:#241d11; --surface:#1f1a11; --raise:#2a2317;
  --ink:#f8f0dc; --muted:#a3967b; --line:#3a3123;
  --gold:#e5ae2b; --amber:#f6c22a; --deep:#f0c75a;
  --tens:#17283a; --tensline:#3f6186; --tensink:#8cc0ef; --bandt:#2f537a;
  --ones:#331c27; --onesline:#7a4258; --onesink:#f0a6c6; --bando:#8d4b64;
  --good:#4fc295;
  --wing:#2c4357; --wingline:#5d7d96; --combline:#7a5c16;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14110b; --glow:#241d11; --surface:#1f1a11; --raise:#2a2317;
  --ink:#f8f0dc; --muted:#a3967b; --line:#3a3123;
  --gold:#e5ae2b; --amber:#f6c22a; --deep:#f0c75a;
  --tens:#17283a; --tensline:#3f6186; --tensink:#8cc0ef; --bandt:#2f537a;
  --ones:#331c27; --onesline:#7a4258; --onesink:#f0a6c6; --bando:#8d4b64;
  --good:#4fc295;
  --wing:#2c4357; --wingline:#5d7d96; --combline:#7a5c16;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(120% 60% at 50% 0%,var(--glow) 0%,transparent 70%)}
.wrap{max-width:540px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 34px}

.brand{display:flex;align-items:center;gap:9px;justify-content:center;transition:all .2s}
body.pv .brand .mark{width:19px;height:19px}
body.pv .brand b{font-size:13px;letter-spacing:.13em}
body.pv .sub{display:none}
body.pv .wrap{padding-block:10px 20px}
.brand .mark{width:28px;height:28px;flex:none}
.brand b{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:.15em;color:var(--gold)}
.sub{text-align:center;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.14em;margin:3px 0 16px}

.hero{display:block;width:100%;height:auto;aspect-ratio:736/414;object-fit:cover;border-radius:18px;border:1.5px solid var(--line);margin:2px 0 16px;box-shadow:0 6px 20px rgba(140,100,10,.14)}
.rulebee{position:absolute;inset-inline-start:14px;top:-20px;width:58px;height:58px;pointer-events:none;animation:hover 3.4s ease-in-out infinite}
.mascot{display:block;width:104px;height:auto;margin:2px auto 2px;animation:hover 3.4s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(-3px) rotate(-1.5deg)}50%{transform:translateY(3px) rotate(1.5deg)}}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(26px,7.5vw,34px);line-height:1.22;
  text-wrap:balance;text-align:center;margin:0 0 8px;unicode-bidi:plaintext}
.lede{text-align:center;color:var(--muted);font-size:14.5px;line-height:1.75;margin:0 auto 20px;max-width:38ch;unicode-bidi:plaintext}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.tile{position:relative;min-height:104px;justify-content:center;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:7px;
  background:var(--surface);border:1.5px solid var(--line);border-radius:17px;padding:17px 8px 13px;
  text-decoration:none;color:inherit;transition:transform .16s,border-color .16s,box-shadow .16s;
  box-shadow:0 1px 0 rgba(0,0,0,.03)}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 20px rgba(140,100,10,.13)}
.tile .hexno{position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:26px;height:26px}
.tile .hexno text{font-family:var(--disp);font-weight:800;font-size:12px;fill:#fff}
.tile .eq{font-family:var(--disp);font-weight:800;font-size:25px;font-variant-numeric:tabular-nums;margin-top:5px}
.tile .tag{font-family:var(--disp);font-weight:800;font-size:9.5px;letter-spacing:.15em;color:var(--muted)}

.note{position:relative;margin-top:30px;background:var(--raise);border:1.5px solid var(--line);border-radius:17px;padding:16px 18px;
  display:flex;flex-direction:column;gap:9px}
.note h2{font-family:var(--disp);font-size:16px;margin:0;color:var(--gold);unicode-bidi:plaintext}
.keyrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.key{display:flex;align-items:center;gap:7px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:999px;padding:6px 14px 6px 8px;font-family:var(--disp);font-weight:800;font-size:15px}
.key svg{width:22px;height:22px;flex:none}
.note p{margin:0;font-size:13.5px;line-height:1.8;color:var(--muted);unicode-bidi:plaintext}

/* ---- problem view ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;min-height:42px}
.tools{display:flex;align-items:center;gap:7px}
.chip{font-family:var(--disp);font-weight:800;font-size:12.5px;letter-spacing:.04em;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;touch-action:manipulation;box-shadow:none}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.back{display:inline-flex;align-items:center;min-height:40px;font-family:var(--disp);font-weight:800;font-size:12.5px;letter-spacing:.08em;color:var(--muted);
  text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;background:var(--surface)}
.back:hover{border-color:var(--gold);color:var(--gold)}
.mute{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;width:42px;height:42px;touch-action:manipulation;
  display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.mute svg{width:17px;height:17px;fill:var(--muted)}
.mute:hover{border-color:var(--gold)}

.eqbar{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--disp);font-weight:800;
  font-size:clamp(30px,9.5vw,42px);font-variant-numeric:tabular-nums;margin:2px 0 12px;line-height:1.1}
.eqbar .res{color:var(--muted);min-width:1.4em;text-align:center;display:inline-block}
.eqbar .res.on{color:var(--good);animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.22)}100%{transform:scale(1);opacity:1}}

.stage{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:0 2px 0 rgba(0,0,0,.03)}
.stage svg.board{display:block;width:100%;height:auto}

.panel-t{fill:var(--tens);stroke:var(--tensline)}
.panel-o{fill:var(--ones);stroke:var(--onesline)}
.plab{font-family:var(--disp);font-weight:800;font-size:11px;letter-spacing:.16em}
.plab-t{fill:var(--tensink)} .plab-o{fill:var(--onesink)}
.band-t{fill:var(--bandt)} .band-o{fill:var(--bando)}
.onband{fill:#fff}
.psub{font-family:"Cairo","Baloo",sans-serif;font-weight:700;font-size:10px}

  color:var(--muted);margin-top:13px}
.cap{min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:17px;font-weight:700;line-height:1.65;padding:7px 4px 2px;text-wrap:balance;unicode-bidi:plaintext}

function rowPos(ids,cx,cy,perRow,dx,dy){
  var map={},rows=Math.ceil(ids.length/perRow)||1,i,r,c,n,sx,top=cy-(rows-1)*dy/2;
  for(i=0;i<ids.length;i++){
    r=Math.floor(i/perRow); c=i%perRow;
    n=Math.min(perRow,ids.length-r*perRow);
    sx=cx-(n-1)*dx/2;
    map[ids[i]]={x:sx+c*dx,y:top+r*dy};
  }
  return map;
}
function place(tens,ones,y){
  var m=rowPos(tens,TX,y,4,31,29),o=rowPos(ones,OX,y,6,23,22),k;
  for(k in o)m[k]=o[k];
  return m;
}
function merge(){var r={},i,k;for(i=0;i<arguments.length;i++){for(k in arguments[i])r[k]=arguments[i][k];}return r;}
function ids(p,n){var a=[],i;for(i=0;i<n;i++)a.push(p+i);return a;}

function buildAdd(a,b){
  var at=Math.floor(a/10),ao=a%10,bt=Math.floor(b/10),bo=b%10;
  var TA=ids("ta",at),OA=ids("oa",ao),TB=ids("tb",bt),OB=ids("ob",bo),N=["nc"];
  var allT=TA.concat(TB),allO=OA.concat(OB);
  var need=allO.length>=10;
  var univ=[];
  allT.forEach(function(id){univ.push({id:id,kind:"c"});});
  if(need)univ.push({id:"nc",kind:"c"});
  allO.forEach(function(id){univ.push({id:id,kind:"b"});});

  S.push({cap:{en:"We start with "+a+" — tens: "+at+" · ones: "+ao,ar:"نبدأ بالعدد "+a+" — عشرات: "+at+" · آحاد: "+ao},pos:place(TA,OA,ROWA),show:TA.concat(OA)});
  S.push({cap:{en:"Now we add "+b+" — tens: "+bt+" · ones: "+bo,ar:"نضيف العدد "+b+" — عشرات: "+bt+" · آحاد: "+bo},pos:merge(place(TA,OA,ROWA),place(TB,OB,ROWB)),show:TA.concat(OA,TB,OB)});
  S.push({cap:{en:"Add ones to ones, and tens to tens",ar:"نجمع الآحاد مع الآحاد، والعشرات مع العشرات"},pos:place(allT,allO,ROWM),show:TA.concat(OA,TB,OB)});
  if(!need){

    return {univ:univ,steps:S};
  }
  var trade=allO.slice(0,10),keep=allO.slice(10);
  S.push({cap:{en:allO.length+" bees — that is more than 9, so we must trade",ar:"عدد النحلات "+allO.length+"، وهو أكبر من 9، إذن لا بد من التبديل"},pos:place(allT,allO,ROWM),show:TA.concat(OA,TB,OB),hl:trade});
  var hud=place(allT,keep,ROWM);
  trade.forEach(function(id,i){var a2=Math.PI*2*i/10;hud[id]={x:OX+Math.cos(a2)*7,y:ROWM+Math.sin(a2)*7};});
  S.push({cap:{en:"Ten bees come together",ar:"نجمع عشر نحلات معا"},pos:hud,show:TA.concat(OA,TB,OB),hl:trade,sfx:"gather"});

  S.push({cap:{en:"The answer is "+(a+b)+" — tens: "+(allT.length+1)+" · ones: "+keep.length,ar:"الناتج "+(a+b)+" — عشرات: "+(allT.length+1)+" · آحاد: "+keep.length},pos:place(allT.concat(N),keep,ROWM),show:allT.concat(N,keep),done:1,sfx:"done"});
  return {univ:univ,steps:S};
}

function buildSub(a,b){
  var at=Math.floor(a/10),ao=a%10,bt=Math.floor(b/10),bo=b%10;
  var need=ao<bo;
  var TA=ids("ta",at),OA=ids("oa",ao),NB=need?ids("nb",10):[];

  S.push({cap:{en:"We take away "+b+" — tens: "+bt+" · ones: "+bo,ar:"نطرح العدد "+b+" — عشرات: "+bt+" · آحاد: "+bo},pos:place(TA,OA,ROWM),show:TA.concat(OA)});
  if(!need){
    var kT=TA.slice(0,bt), sT=TA.slice(bt), kO=OA.slice(0,bo), sO=OA.slice(bo);
    S.push({cap:{en:"There are "+ao+" bees — enough to take away "+bo+", so we do not borrow",ar:"عدد النحلات "+ao+"، وهو يكفي لطرح "+bo+"، إذن لا حاجة إلى الاستلاف"},pos:place(TA,OA,ROWM),show:TA.concat(OA),hl:OA.length?OA:null,sfx:"gather"});
    var off=place(TA,OA,ROWM);

function tone(f,t0,dur,vol,type){
  if(MUTED)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
function sfx(k){
  if(k==="gather"){tone(420,0,.16,.05,"triangle");tone(520,.09,.16,.05,"triangle");}
  else if(k==="trade"){tone(523,0,.2,.07);tone(659,.1,.2,.07);tone(784,.2,.34,.07);}
  else if(k==="done"){tone(784,0,.2,.07);tone(988,.11,.2,.07);tone(1175,.22,.46,.06);}
  else tone(300,0,.07,.025,"triangle");
}

}

var CUR={a:"",b:"",op:"+",act:"a"};
function check(){
  if(CUR.a===""||CUR.b==="")return {ok:0,quiet:1,msg:t("vEmpty")};
  var A=+CUR.a,B=+CUR.b;
  if(CUR.op==="+"&&A+B>99)return {ok:0,msg:t("vBig")};
  if(CUR.op==="-"&&B>A)return {ok:0,msg:t("vOrder")};
  return {ok:1,msg:t("vReady")};
}
var DEL='<svg viewBox="0 0 24 24"><path d="M9.2 5.5H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9.2L2.6 12z"/>'
       +'<path d="M13 9.6l4 4.8M17 9.6l-4 4.8"/></svg>';
function hk(label,attr,fn){
  return '<button class="hk'+(fn?" fn":"")+'" '+attr+'><span class="rim"></span><i></i>'
    +(fn===2?label:'<span>'+label+'</span>')+'</button>';
}
function keypad(){
  var r=[["1","2","3"],["4","5","6"],["7","8","9"]],h="",i,j;
  for(i=0;i<3;i++){
    h+='<div class="hrow'+(i%2?" off":"")+'">';
    for(j=0;j<3;j++)h+=hk(r[i][j],'data-d="'+r[i][j]+'"',0);
    h+='</div>';
  }
  h+='<div class="hrow off">'
   +hk(DEL,'data-act="del" aria-label="delete"',2)
   +hk("0",'data-d="0"',0)
   +hk("C",'data-act="clr"',1)
   +'</div>';
  return '<div class="hpad">'+h+'</div>';
}

function mPanel(x,cls,lab,sub,n,cid){
  var W=156,band=(cls==="panel-t"?"band-t":"band-o"),ch=(cls==="panel-t"?"chip-t":"chip-o");
  return '<clipPath id="mk'+cid+'"><rect x="'+x+'" y="2" width="'+W+'" height="108" rx="15"/></clipPath>'
   +'<g clip-path="url(#mk'+cid+')">'
   +'<rect x="'+x+'" y="2" width="'+W+'" height="108" class="'+cls+'" stroke="none"/>'
   +'<rect x="'+x+'" y="2" width="'+W+'" height="23" class="'+band+'"/></g>'
   +'<rect x="'+x+'" y="2" width="'+W+'" height="108" rx="15" class="'+cls+'" style="fill:none" stroke-width="1.5"/>'
   +'<text class="mlab" x="'+(x+11)+'" y="14.5" dominant-baseline="central">'+lab+'</text>'
   +'<text class="msub" x="'+(x+51)+'" y="15" dominant-baseline="central">'+sub+'</text>'
   +'<rect class="'+ch+'" x="'+(x+W-38)+'" y="5.5" width="30" height="16" rx="8" stroke="#fff" stroke-width="1.2"/>'
   +'<text class="mnum" x="'+(x+W-23)+'" y="14" text-anchor="middle" dominant-baseline="central">'+n+'</text>';
}

function wireCalc(){
  var sa=document.getElementById("sa"),sb=document.getElementById("sb"),
      sym=document.getElementById("sym"),hint=document.getElementById("hint"),
      run=document.getElementById("run"),pad=document.querySelector(".hpad"),
      dice=document.getElementById("dice"),mini=document.getElementById("mini");
  if(!sa||!run)return;
  var shown=null;
  function draw(){
    var cv=CUR[CUR.act];
    if(cv!==shown){mini.innerHTML=miniHive(cv);shown=cv;}
    sa.textContent=CUR.a===""?"?":CUR.a;
    sb.textContent=CUR.b===""?"?":CUR.b;
    sa.classList.toggle("ph",CUR.a==="");
    sb.classList.toggle("ph",CUR.b==="");
    sa.classList.toggle("act",CUR.act==="a");
    sb.classList.toggle("act",CUR.act==="b");
    sym.innerHTML=CUR.op==="+"?"+":"−";
    Array.prototype.forEach.call(document.querySelectorAll(".op"),function(o){
      o.classList.toggle("on",o.getAttribute("data-op")===CUR.op);
    });
    var v=check();
    hint.innerHTML=v.msg;
    hint.className="hint"+(v.ok?" ok":(v.quiet?"":" bad"));
    run.disabled=!v.ok;
  }
  function digit(d){
    var k=CUR.act;
    if(CUR[k].length>=2||CUR[k]==="0")CUR[k]="";
    CUR[k]=(CUR[k]+d).slice(0,2);
    if(k==="a"&&CUR.a.length===2)CUR.act="b";
    sfx("tick");draw();
  }
  function del(){
    var k=CUR.act;
    if(CUR[k]===""&&k==="b"){CUR.act="a";k="a";}
    CUR[k]=CUR[k].slice(0,-1);
    sfx("tick");draw();
  }
  function rnd(){
    var op=Math.random()<.5?"+":"-",a=0,b=0,i;
    for(i=0;i<400;i++){
      a=10+Math.floor(Math.random()*80);
      b=10+Math.floor(Math.random()*80);
      if(op==="+"){if(a+b<=99&&(a%10)+(b%10)>=10)break;}
      else {if(a>b&&(a%10)<(b%10))break;}
    }
    if(i>=400){if(op==="+"){a=27;b=15;}else{a=52;b=17;}}
    CUR.a=""+a;CUR.b=""+b;CUR.op=op;CUR.act="b";
    sfx("trade");draw();
  }
  sa.addEventListener("click",function(){CUR.act="a";draw();});
  sb.addEventListener("click",function(){CUR.act="b";draw();});
  pad.addEventListener("click",function(e){
    var el=e.target.closest?e.target.closest(".hk"):null;
    if(!el)return;
    var d=el.getAttribute("data-d"),ac=el.getAttribute("data-act");
    if(d!==null)digit(d);
    else if(ac==="del")del();
    else {CUR.a="";CUR.b="";CUR.act="a";sfx("tick");draw();}
  });
  Array.prototype.forEach.call(document.querySelectorAll(".op"),function(o){
    o.addEventListener("click",function(){CUR.op=o.getAttribute("data-op");sfx("tick");draw();});
  });
  dice.addEventListener("click",rnd);
  run.addEventListener("click",function(){
    if(check().ok)location.hash="go="+CUR.a+CUR.op+CUR.b;
  });
  function onKey(e){
    if(!document.getElementById("sa")){document.removeEventListener("keydown",onKey);return;}
    var k=e.key;
    if(/^[0-9]$/.test(k)){digit(k);e.preventDefault();}
    else if(k==="Backspace"){del();e.preventDefault();}
    else if(k==="+"||k==="-"){CUR.op=k;draw();}
    else if(k==="Enter"&&!run.disabled)run.click();
  }
  document.addEventListener("keydown",onKey);
  draw();
}

function runProb(built,res){
  var g=document.getElementById("items"),cap=document.getElementById("cap"),
      stepno=document.getElementById("stepno"),fill=document.getElementById("fill"),
      resEl=document.getElementById("res"),burst=document.getElementById("burst"),
      ct=document.getElementById("ct"),co=document.getElementById("co"),
      prev=document.getElementById("prev"),next=document.getElementById("next"),
      mute=document.getElementById("mute");
  if(!mute)return;
  if(!g)return;
  if(ACTIVE){clearInterval(ACTIVE);ACTIVE=null;}
  var html="",node={},nb=0;
  built.univ.forEach(function(u){
    html+='<g class="it'+(u.id==="nc"?" newcomb":"")+'" data-id="'+u.id+'" style="opacity:0;transform:translate('+OX+'px,'+ROWM+'px)">'
       +(u.kind==="c"?combSVG():beeSVG(nb++))+'</g>';
  });
  g.innerHTML=html;
  Array.prototype.forEach.call(g.children,function(el){node[el.getAttribute("data-id")]=el;});

  var i=-1,timer=null,total=built.steps.length;
  function paint(n,user){
    var s=built.steps[n],show={},hl={},any=!!(s.hl&&s.hl.length),tc=0,oc=0;
    (s.show||[]).forEach(function(id){show[id]=1;});
    (s.hl||[]).forEach(function(id){hl[id]=1;});
    built.univ.forEach(function(u){
      var el=node[u.id],pos=s.pos[u.id];
      if(pos)el.style.transform="translate("+pos.x+"px,"+pos.y+"px)";
      el.style.opacity=show[u.id]?"1":"0";
      el.classList.toggle("hl",!!hl[u.id]);
      el.classList.toggle("dim",any&&!!show[u.id]&&!hl[u.id]);
      if(show[u.id]){ if(u.kind==="c")tc++; else oc++; }
    });
    ct.textContent=tc; co.textContent=oc;
    cap.textContent=typeof s.cap==="string"?s.cap:s.cap[LANG];
    stepno.textContent=t("step")+" "+(n+1)+" "+t("of")+" "+total;
    fill.style.width=((n+1)/total*100).toFixed(1)+"%";
    resEl.textContent=s.done?res:"?";
    resEl.classList.toggle("on",!!s.done);
    if(s.burst){ burst.classList.remove("go"); void burst.offsetWidth; burst.classList.add("go");
      if(node.nc){node.nc.classList.remove("pop"); void node.nc.offsetWidth; node.nc.classList.add("pop");} }
    if(s.sfx)sfx(s.sfx); else if(user)sfx("tick");
    prev.disabled=n===0;
    next.textContent=n===total-1?t("again"):t("next");
    prev.textContent=t("prev");
  }
  function go(n,user){ if(n<0)n=0; if(n>=total)n=0; i=n; paint(i,user); }
  REPAINT=function(){paint(i,0);};
  prev.addEventListener("click",function(){go(i-1,1);});
  next.addEventListener("click",function(){go(i+1,1);});
  var st=document.querySelector(".stage"),sx=0,sy=0,sw=false;
  st.addEventListener("click",function(){ if(!sw)go(i+1,1); sw=false; });
  st.addEventListener("touchstart",function(e){var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;sw=false;},{passive:true});
  st.addEventListener("touchend",function(e){
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.6){sw=true;clearInterval(timer);go(dx<0?i+1:i-1,1);}
  },{passive:true});
  mute.addEventListener("click",function(){
    MUTED=!MUTED;
    mute.querySelector("svg").style.opacity=MUTED?".4":"1";
    mute.setAttribute("aria-pressed",MUTED?"true":"false");
    if(!MUTED)sfx("tick");
  });
  go(0);
  timer=ACTIVE=setInterval(function(){
    if(i>=total-1){clearInterval(timer);return;}
    go(i+1);
  },2900);
  document.addEventListener("click",function once(){clearInterval(timer);document.removeEventListener("click",once,true);},true);
}

function custom(k){
  if(k.indexOf("go=")!==0)return null;
  var m=/^(\d{1,2})([-+])(\d{1,2})$/.exec(decodeURIComponent(k.slice(3)));
  if(!m)return null;
  var A=+m[1],B=+m[3];
  if(m[2]==="+"?A+B>99:B>A)return null;
  CUR.a=""+A; CUR.b=""+B; CUR.op=m[2]; CUR.act="b";
  return {a:A,b:B,op:m[2]};
}
function route(){
  var k=(location.hash||"").replace("#",""),c=custom(k);
  var v=document.getElementById("view");
  document.body.classList.toggle("pv",!!PROBS[k]||!!c);
  REPAINT=null;
  if(c)v.innerHTML=probView(c,"#try");
  else if(k==="try"){if(CUR.a.length>=2&&CUR.b.length>=2)CUR.act="a";v.innerHTML=tryView();}
  else if(PROBS[k])v.innerHTML=probView(PROBS[k],"#");
  else v.innerHTML=homeView();
  var lb=document.getElementById("lang");
  if(lb)lb.addEventListener("click",function(){
    LANG=LANG==="en"?"ar":"en";
    document.documentElement.setAttribute("lang",LANG);
    lb.innerHTML=t("other");
    var bk=document.querySelector(".back");
    if(bk)bk.innerHTML=backLab(bk.getAttribute("href"));
    if(REPAINT)REPAINT(); else route();
  });
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
})();
