<style>
/* layout: phone-first — one pictograph at a time, four categories, chart row, compare card */
:root{
  --bg:#f4f7fd; --glow:#ffffff; --surface:#ffffff; --raise:#edf2fb;
  --ink:#0f1f3d; --muted:#6f7d96; --line:#dde5f2;
  --blue:#2458d6; --blued:#e3ebfc; --bluel:#a9c3f3;
  --orange:#f04e24; --oranged:#fde9e3; --orangel:#f7b49d;
  --gold:#e0a516; --good:#1a8558;
  --acc:var(--blue); --accL:var(--blued); --accB:var(--bluel);
  --disp:"Baloo Bhaijaan 2","Baloo","Trebuchet MS",sans-serif;
  --body:"Cairo","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1424; --glow:#141f37; --surface:#15203a; --raise:#1a2742;
  --ink:#e9f0ff; --muted:#8e9db9; --line:#2a3a58;
  --blue:#5e8ef2; --blued:#1a2c4e; --bluel:#38507d;
  --orange:#ff7e5a; --oranged:#3b2019; --orangel:#7e4634;
  --gold:#e8b949; --good:#4fc295; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1424; --glow:#141f37; --surface:#15203a; --raise:#1a2742;
  --ink:#e9f0ff; --muted:#8e9db9; --line:#2a3a58;
  --blue:#5e8ef2; --blued:#1a2c4e; --bluel:#38507d;
  --orange:#ff7e5a; --oranged:#3b2019; --orangel:#7e4634;
  --gold:#e8b949; --good:#4fc295; color-scheme:dark}
:root.v{--acc:var(--orange);--accL:var(--oranged);--accB:var(--orangel)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:var(--body);
  background-image:radial-gradient(120% 50% at 50% 0%,var(--glow) 0%,transparent 70%)}
.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 26px}

.brand{display:flex;align-items:center;gap:8px;justify-content:center}
.brand svg{width:21px;height:21px;flex:none}
.brand b{font-family:var(--disp);font-weight:800;font-size:14px;letter-spacing:.14em;color:var(--acc)}
.sub{text-align:center;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.14em;margin:2px 0 10px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;margin-bottom:8px}
.chip{font-family:var(--disp);font-weight:800;font-size:12.5px;min-height:38px;padding:0 13px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;touch-action:manipulation}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.tools{display:flex;gap:7px}

.q{font-family:var(--disp);font-weight:800;font-size:clamp(20px,5.6vw,26px);line-height:1.22;text-align:center;
  margin:0 0 4px;unicode-bidi:plaintext}
.qk{text-align:center;font-family:var(--disp);font-weight:800;font-size:9.5px;letter-spacing:.22em;color:var(--muted);margin-bottom:10px}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tab{font-family:var(--disp);font-weight:800;font-size:14.5px;min-height:46px;border-radius:14px;cursor:pointer;
  border:2px solid var(--line);background:var(--surface);color:var(--muted);touch-action:manipulation;unicode-bidi:plaintext}
.tab.on.b{border-color:var(--blue);background:var(--blue);color:#fff}
.tab.on.o{border-color:var(--orange);background:var(--orange);color:#fff}

.stage{position:relative;background:var(--surface);border:2px solid var(--accB);border-radius:18px;overflow:hidden;
  box-shadow:0 8px 22px rgba(15,31,61,.07)}
.head{background:var(--acc);padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
.head .t{font-family:var(--disp);font-weight:800;font-size:13.5px;color:#fff;letter-spacing:.05em;unicode-bidi:plaintext}
.head .k{font-family:var(--disp);font-weight:800;font-size:10px;color:#fff;opacity:.9;display:flex;align-items:center;gap:5px}
.head .k i{width:11px;height:11px;border-radius:50%;background:#fff;display:inline-block}
.stage svg{display:block;width:100%;height:auto}
.ax{font-family:var(--disp);font-weight:800;font-size:9px;fill:var(--muted)}
.grid{stroke:var(--line);stroke-width:1}
.base{stroke:var(--ink);stroke-width:2.2;opacity:.55}
.cat{font-family:var(--disp);font-weight:800;font-size:11px;fill:var(--ink)}
.ico{fill:none;stroke:var(--ink);stroke-linecap:round}
.ico .f{fill:var(--ink);stroke:none}
.dot .r{fill:none;stroke:var(--line);stroke-width:2;transition:fill .18s,stroke .18s;
  transform-box:fill-box;transform-origin:center}
.dot.on .r{stroke:none;fill:var(--acc)}
.dot .ring{fill:none;stroke:var(--acc);stroke-width:2.6;opacity:0;transform-box:fill-box;transform-origin:center}
.dot.in .r{animation:drop .54s cubic-bezier(.22,1.35,.4,1) both}
.dot.in .ring{animation:ring .6s ease-out both}
.dot.out .r{fill:var(--acc);stroke:none;animation:fly .34s ease-in forwards}
@keyframes drop{0%{transform:translateY(78px) scale(.28);opacity:0}42%{opacity:1}
  74%{transform:translateY(-7px) scale(1.15)}100%{transform:translateY(0) scale(1)}}
@keyframes ring{0%{opacity:0;transform:scale(.35)}32%{opacity:.5}100%{opacity:0;transform:scale(2.7)}}
@keyframes fly{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-36px) scale(.18);opacity:0}}
.colhl{fill:var(--acc);opacity:0}
.colhl.flash{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.14}100%{opacity:0}}
.flag{transition:transform .42s cubic-bezier(.25,1.3,.45,1),opacity .22s}
.flagbg{fill:var(--acc)}
.flagt{font-family:var(--disp);font-weight:800;font-size:11.5px;fill:#fff}

.ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.pair{display:flex;gap:6px;justify-content:center}
.rb{width:40px;height:40px;border-radius:50%;border:2px solid var(--acc);background:var(--surface);color:var(--acc);
  font-family:var(--disp);font-weight:800;font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation;
  display:grid;place-items:center;transition:transform .1s}
.rb.p{background:var(--acc);color:#fff}
.rb:active{transform:scale(.9)}
.rb:disabled{opacity:.3;cursor:default}

.sec{font-family:var(--disp);font-weight:800;font-size:10px;letter-spacing:.24em;color:var(--muted);
  text-align:center;margin:16px 0 7px}
.chart{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--acc);border-radius:14px;overflow:hidden}
.ch{padding:7px 2px;text-align:center;background:var(--surface)}
.ch+.ch{border-left:2px solid var(--accB)}
.ch .cl{font-family:var(--disp);font-weight:800;font-size:9.5px;color:var(--acc);unicode-bidi:plaintext}
.ch .cv{font-family:var(--disp);font-weight:800;font-size:23px;line-height:1.1;font-variant-numeric:tabular-nums;transition:color .2s}
.ch .cv.hit{color:var(--acc)}

.cmp{background:var(--raise);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);
  border-radius:11px;padding:10px 12px;unicode-bidi:plaintext}
.row .k{font-family:var(--disp);font-weight:800;font-size:9.5px;letter-spacing:.14em;color:var(--muted);unicode-bidi:plaintext}
.row .v{font-family:var(--disp);font-weight:800;font-size:17px;unicode-bidi:plaintext}
.v.a{color:var(--acc)} .v.g{color:var(--good)} .v.d{color:var(--gold)}
.bump{animation:bump .4s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}

.both{margin-top:10px;background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:11px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;unicode-bidi:plaintext}
.both .s{font-family:var(--disp);font-weight:800;font-size:13px}
.both .s.b{color:var(--blue)} .both .s.o{color:var(--orange)}
.both .m{font-family:var(--disp);font-weight:800;font-size:12px;color:var(--muted);text-align:center;flex:1}

.foot{margin-top:20px;text-align:center;font-family:var(--disp);font-weight:800;font-size:10px;
  letter-spacing:.22em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.dot .r,.dot .ring,.colhl,.flag,.bump{animation:none;transition:none}}
</style>

<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="11" width="4.6" height="10" rx="1.6" fill="var(--blue)"/>
      <rect x="9.7" y="4" width="4.6" height="17" rx="1.6" fill="var(--orange)"/>
      <rect x="16.4" y="8" width="4.6" height="13" rx="1.6" fill="var(--blue)"/>
    </svg>
    <b>LIVE GRAPH</b>
  </div>
  <div class="sub">CLASS 2B &nbsp;·&nbsp; MATH FESTIVAL</div>

  <div class="topbar">
    <button class="chip" id="reset">Reset</button>
    <span class="tools"><button class="chip" id="lang">العربية</button>
    <button class="chip" id="mute" aria-label="sound">🔊</button></span>
  </div>

  <div class="qk" id="qk">TODAY'S QUESTION</div>
  <h1 class="q" id="q">How do you come to school?</h1>

  <div class="tabs">
    <button class="tab b on" id="tb" data-g="b">Class 2B</button>
    <button class="tab o" id="tv" data-g="v">Visitors</button>
  </div>

  <div class="stage">
    <div class="head"><span class="t" id="gname">Class 2B</span><span class="k"><i></i><span id="gkey">= 1 student</span></span></div>
    <svg viewBox="0 0 340 272" role="img" aria-label="pictograph"><g id="plot"></g></svg>
  </div>

  <div class="ctrl" id="ctrl"></div>

  <div class="sec" id="secChart">CHART</div>
  <div class="chart" id="chart"></div>

  <div class="sec" id="secCmp">LET'S COMPARE</div>
  <div class="cmp">
    <div class="row"><span class="k" id="kG">GREATEST</span><span class="v a" id="vG">—</span></div>
    <div class="row"><span class="k" id="kL">LEAST</span><span class="v a" id="vL">—</span></div>
    <div class="row"><span class="k" id="kD">DIFFERENCE</span><span class="v d" id="vD">—</span></div>
    <div class="row"><span class="k" id="kT">TOTAL NUMBER</span><span class="v g" id="vT">—</span></div>
  </div>

  <div class="sec" id="secBoth">BOTH GRAPHS</div>
  <div class="both">
    <span class="s b" id="sb">0</span>
    <span class="m" id="sm">—</span>
    <span class="s o" id="so">0</span>
  </div>

  <div class="foot">COUNT · CHART · COMPARE</div>
</div>

<script>
(function(){
var D={b:[0,0,0,0],v:[0,0,0,0]}, G="b", MAXR=8, LANG="en", MUTED=false, AC=null;
var STR={
 en:{qk:"TODAY'S QUESTION",q:"How do you come to school?",
     cats:["Bus","Car","Walk","Bike"],tb:"Class 2B",tv:"Visitors",
     key:"= 1 student",keyv:"= 1 visitor",
     chart:"CHART",cmp:"LET'S COMPARE",both:"BOTH GRAPHS",
     kG:"GREATEST",kL:"LEAST",kD:"DIFFERENCE",kT:"TOTAL NUMBER",
     reset:"Reset",other:"العربية",dash:"—",
     eqW:"equal in number",
     cmpMore:function(a,b,n){return a+" has "+n+" more";},cmpEq:"Equal in number"},
 ar:{qk:"سؤال اليوم",q:"كيف تأتي إلى المدرسة؟",
     cats:["حافلة","سيارة","مشيا","دراجة"],tb:"الفصل ٢ب",tv:"الزائرون",
     key:"= تلميذ واحد",keyv:"= زائر واحد",
     chart:"الجدول",cmp:"لنقارن",both:"الرسمان معا",
     kG:"الأكثر",kL:"الأقل",kD:"الفرق",kT:"المجموع",
     reset:"إعادة",other:"English",dash:"—",
     eqW:"متساوية",
     cmpMore:function(a,b,n){return a+" أكثر بمقدار "+n;},cmpEq:"متساويان"}
};
function t(k){return STR[LANG][k];}
function el(i){return document.getElementById(i);}

function tone(f,t0,dur,vol,type){
  if(MUTED)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    var o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t0;
    o.type=type||"sine";o.frequency.setValueAtTime(f,s);
    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.015);
    g.gain.exponentialRampToValueAtTime(.0001,s+dur);
    o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur+.05);
  }catch(e){}
}

var CX=[64,133,207,276], BASE=214, ROW=23, R=10.2;
function icon(i,x,y){
  var g='<g class="ico" transform="translate('+x+','+y+')" stroke-width="1.9">';
  if(i===0) g+='<rect x="-8" y="-8.5" width="16" height="12.5" rx="2.6"/><path d="M-8 -2.2 H8"/>'
              +'<circle class="f" cx="-4.4" cy="5.6" r="1.7"/><circle class="f" cx="4.4" cy="5.6" r="1.7"/>';
  else if(i===1) g+='<path d="M-9 2.2 v-2.4 l2.6 -4.4 h12.8 l2.6 4.4 v2.4 z" stroke-linejoin="round"/>'
              +'<circle class="f" cx="-4.8" cy="3.6" r="1.8"/><circle class="f" cx="4.8" cy="3.6" r="1.8"/>';
  else if(i===2) g+='<circle class="f" cx="0" cy="-7.4" r="2.3"/>'
              +'<path d="M0 -4.6 v5.2 M0 0.6 l-3.6 5.2 M0 0.6 l3.6 5.2 M-4 -2.6 l4 1.2 l4 -2.2"/>';
  else g+='<circle cx="-5.6" cy="3.2" r="4.1"/><circle cx="5.6" cy="3.2" r="4.1"/>'
              +'<path d="M-5.6 3.2 L-1 -3.4 H4.2 L5.6 3.2 M-1 -3.4 L1.6 3.2" stroke-linejoin="round"/>'
              +'<circle class="f" cx="4.2" cy="-5" r="1.3"/>';
  return g+'</g>';
}

function buildPlot(){
  var o=[],i,r;
  for(r=1;r<=MAXR;r++){
    var y=BASE-(r-0.5)*ROW;
    o.push('<line class="grid" x1="30" y1="'+(BASE-r*ROW)+'" x2="320" y2="'+(BASE-r*ROW)+'"/>');
    o.push('<text class="ax" x="20" y="'+y+'" text-anchor="middle" dominant-baseline="central">'+r+'</text>');
  }
  o.push('<line class="base" x1="30" y1="'+BASE+'" x2="320" y2="'+BASE+'"/>');
  o.push('<line class="base" x1="30" y1="'+(BASE-MAXR*ROW)+'" x2="30" y2="'+BASE+'"/>');
  for(i=0;i<4;i++){
    o.push('<rect class="colhl" id="hl'+i+'" x="'+(CX[i]-32)+'" y="'+(BASE-MAXR*ROW)+'" width="64" height="'+(MAXR*ROW)+'" rx="10"/>');
    for(r=0;r<MAXR;r++){
      o.push('<g class="dot" data-c="'+i+'" data-r="'+r+'" transform="translate('+CX[i]+','+(BASE-(r+0.5)*ROW)+')">'
            +'<circle class="ring" r="'+R+'"/><circle class="r" r="'+R+'"/></g>');
    }
    o.push('<g class="flag" id="flag'+i+'" opacity="0"><rect class="flagbg" x="-14" y="-9.5" width="28" height="19" rx="9.5"/>'
          +'<text class="flagt" id="flagt'+i+'" x="0" y="0.5" text-anchor="middle" dominant-baseline="central">0</text></g>');
    o.push(icon(i,CX[i],BASE+20));
    o.push('<text class="cat" id="cat'+i+'" x="'+CX[i]+'" y="'+(BASE+44)+'" text-anchor="middle" dominant-baseline="central"></text>');
  }
  el("plot").innerHTML=o.join("");
}
buildPlot();

function buildCtrl(){
  var o=[],i;
  for(i=0;i<4;i++){
    o.push('<div class="pair"><button class="rb m" data-c="'+i+'" data-d="-1">−</button>'
          +'<button class="rb p" data-c="'+i+'" data-d="1">+</button></div>');
  }
  el("ctrl").innerHTML=o.join("");
  el("ctrl").querySelectorAll(".rb").forEach(function(btn){
    btn.addEventListener("click",function(){
      var c=+btn.dataset.c, d=+btn.dataset.d, a=D[G];
      var nv=Math.min(MAXR,Math.max(0,a[c]+d));
      if(nv===a[c])return;
      var oldv=a[c]; a[c]=nv;
      if(d>0){tone(G==="b"?523:466,0,.13,.055);tone(G==="b"?784:698,.07,.15,.045);}
      else tone(330,0,.12,.04,"triangle");
      if(d<0) fly(c,oldv-1);
      render(d>0?c:-1);
      flashCol(c);
    });
  });
}
buildCtrl();

function buildChart(){
  var o=[],i;
  for(i=0;i<4;i++) o.push('<div class="ch"><div class="cl" id="chl'+i+'"></div><div class="cv" id="chv'+i+'">0</div></div>');
  el("chart").innerHTML=o.join("");
}
buildChart();

function bump(x){if(!x)return;x.classList.remove("bump");void x.offsetWidth;x.classList.add("bump");}
function dotAt(c,r){return el("plot").querySelector('.dot[data-c="'+c+'"][data-r="'+r+'"]');}
function flashCol(c){var h=el("hl"+c);if(!h)return;h.classList.remove("flash");void h.getBoundingClientRect();h.classList.add("flash");}
function fly(c,r){
  var d=dotAt(c,r); if(!d)return;
  d.classList.add("out");
  setTimeout(function(){d.classList.remove("out");},360);
}

function render(popC){
  var a=D[G], cats=t("cats"), i;
  document.documentElement.classList.toggle("v",G==="v");
  el("tb").classList.toggle("on",G==="b"); el("tv").classList.toggle("on",G==="v");
  el("tb").textContent=t("tb"); el("tv").textContent=t("tv");
  el("gname").textContent=G==="b"?t("tb"):t("tv");
  el("gkey").textContent=G==="b"?t("key"):t("keyv");
  el("qk").textContent=t("qk"); el("q").textContent=t("q");
  el("secChart").textContent=t("chart"); el("secCmp").textContent=t("cmp"); el("secBoth").textContent=t("both");
  el("reset").textContent=t("reset"); el("lang").textContent=t("other");
  el("kG").textContent=t("kG"); el("kL").textContent=t("kL");
  el("kD").textContent=t("kD"); el("kT").textContent=t("kT");

  el("plot").querySelectorAll(".dot").forEach(function(d){
    d.classList.toggle("on", +d.dataset.r < a[+d.dataset.c]);
  });
  for(i=0;i<4;i++){
    el("cat"+i).textContent=cats[i];
    el("chl"+i).textContent=cats[i];
    el("chv"+i).textContent=a[i];
  }
  if(popC>=0){
    var d=dotAt(popC,a[popC]-1);
    if(d){d.classList.remove("in");void d.getBoundingClientRect();d.classList.add("in");
      setTimeout(function(){d.classList.remove("in");},620);}
    var cv=el("chv"+popC); bump(cv);
    if(cv){cv.classList.add("hit");setTimeout(function(){cv.classList.remove("hit");},420);}
  }
  for(i=0;i<4;i++){
    var fg=el("flag"+i);
    el("flagt"+i).textContent=a[i];
    fg.setAttribute("opacity", a[i]>0?"1":"0");
    fg.setAttribute("transform","translate("+CX[i]+","+(BASE-a[i]*ROW-13)+")");
  }

  var sum=a[0]+a[1]+a[2]+a[3], mx=Math.max.apply(null,a), mn=Math.min.apply(null,a);
  if(sum===0){
    el("vG").textContent=t("dash"); el("vL").textContent=t("dash");
    el("vD").textContent=t("dash"); el("vT").textContent=t("dash");
  }else{
    var gs=[],ls=[];
    for(i=0;i<4;i++){ if(a[i]===mx)gs.push(cats[i]); if(a[i]===mn)ls.push(cats[i]); }
    el("vG").textContent=(gs.length>1? t("eqW") : gs[0])+"  ("+mx+")";
    el("vL").textContent=(ls.length>1? t("eqW") : ls[0])+"  ("+mn+")";
    el("vD").textContent=mx+" − "+mn+" = "+(mx-mn);
    el("vT").textContent=sum;
  }

  var sb=D.b[0]+D.b[1]+D.b[2]+D.b[3], sv=D.v[0]+D.v[1]+D.v[2]+D.v[3];
  el("sb").textContent=t("tb")+"  "+sb;
  el("so").textContent=sv+"  "+t("tv");
  el("sm").textContent = (sb===sv) ? (sb===0? t("dash") : t("cmpEq"))
      : t("cmpMore")(sb>sv?t("tb"):t("tv"), 0, Math.abs(sb-sv));

  el("ctrl").querySelectorAll('.rb[data-d="1"]').forEach(function(x){x.disabled=a[+x.dataset.c]>=MAXR;});
  el("ctrl").querySelectorAll('.rb[data-d="-1"]').forEach(function(x){x.disabled=a[+x.dataset.c]<=0;});
}

el("tb").addEventListener("click",function(){G="b";tone(523,0,.1,.04);render(-1);});
el("tv").addEventListener("click",function(){G="v";tone(466,0,.1,.04);render(-1);});
el("reset").addEventListener("click",function(){D.b=[0,0,0,0];D.v=[0,0,0,0];tone(392,0,.12,.05);tone(262,.09,.2,.05);render(-1);});
el("lang").addEventListener("click",function(){
  LANG=LANG==="en"?"ar":"en";
  document.documentElement.setAttribute("lang",LANG);
  render(-1);
});
el("mute").addEventListener("click",function(){
  MUTED=!MUTED; el("mute").textContent=MUTED?"🔇":"🔊";
  if(!MUTED)tone(523,0,.1,.05);
});
render(-1);
})();
</script>

</body>
